# Project-wide Gradle settings.

# JVM arguments for better performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel builds for better speed (optional)
org.gradle.parallel=true

# Enable AndroidX support (Required)
android.useAndroidX=true

# Ensure proper Kotlin formatting
kotlin.code.style=official

# Optimize R class to reduce APK size
android.nonTransitiveRClass=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Force Gradle to use new dependency resolution strategy (optional)
android.enableJetifier=true
